function scaleCertificate() {

    if (!certificate) return;

    const originalWidth = 794;
    const zoomLevel = getBrowserZoomLevel();
    const actualViewportWidth = window.innerWidth - 100;
    const correctedViewportWidth = actualViewportWidth / zoomLevel;

    let scale = 0.5;

  // Load html2canvas if not already loaded
  if (!window.html2canvas) {
    const html2canvasScript = document.createElement("script");
    html2canvasScript.src =
      "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    html2canvasScript.onload = initPDFButton;
    document.head.appendChild(html2canvasScript);
  } else {
    initPDFButton();
  }

  // Load jsPDF if not already loaded
  if (!window.jspdf) {
    const jsPDFScript = document.createElement("script");
    jsPDFScript.src =
      "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    jsPDFScript.onload = initPDFButton;
    document.head.appendChild(jsPDFScript);
  } else {
    initPDFButton();
  }

  let librariesLoaded = 0;
  function initPDFButton() {
    librariesLoaded++;
    // Wait until both libraries are loaded
    if (librariesLoaded < 2) return;

    document.addEventListener("DOMContentLoaded", function () {
      const downloadBtn = document.getElementById("downloadPdf");
      if (!downloadBtn) return;

      downloadBtn.addEventListener("click", function () {
        const { jsPDF } = window.jspdf;
        const container = document.querySelector(".pdf-container-btn");
        if (!container) {
          alert("Container class .pdf-container-btn not found!");
          return;
        }

        const originalWidth = container.style.width;
        const originalTransform = container.style.transform;

        container.style.width = "780px";
        container.style.transform = "scale(1)";

        html2canvas(container, {
          scale: window.devicePixelRatio || 2, // mobile-friendly scaling
          useCORS: true,
          backgroundColor: "#ffffff",
          scrollY: -window.scrollY,
        }).then((canvas) => {
          const imgData = canvas.toDataURL("image/png");
          const pdf = new jsPDF("p", "mm", "a4");

          const pdfWidth = pdf.internal.pageSize.getWidth();
          const pdfHeight = pdf.internal.pageSize.getHeight();

          const imgWidth = pdfWidth - 10; // small horizontal margin
          const imgHeight = (canvas.height * imgWidth) / canvas.width;

          let x = 1; // left margin
          let y = 1; // top margin

          if (imgHeight > pdfHeight) y = 0;

          pdf.addImage(imgData, "PNG", x, y, imgWidth, imgHeight);

          // ---- CHANGE HERE ----
          // Open PDF in new tab instead of downloading
          const pdfBlob = pdf.output("blob");
          const pdfUrl = URL.createObjectURL(pdfBlob);
          window.open(pdfUrl, "_blank");

          // Restore original styles
          container.style.width = originalWidth;
          container.style.transform = originalTransform;
        });
      });
    });
  }
})();
